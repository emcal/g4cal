[project]
name = "g4cal"
version = "0.1.0"
description = "PbWO4 crystal-calorimeter Geant4 simulation, parquet store, and reconstruction analysis"
requires-python = ">=3.10"
dependencies = [
    "omegaconf",
    "pandas",
    "pyarrow",      # parquet engine for pandas
    "duckdb",       # query layer over the parquet store
    "numpy",
    "scipy",        # curve_fit for resolution fits
    "matplotlib",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["g4cal"]
